name: Gerar checklist

on:
  push:
    paths:
      - "faturas/*.pdf"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  gerar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: sudo apt-get install -y poppler-utils
      - run: pip install pypdf
      - run: python gerar_checklist.py
      - name: Salvar o index.html
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add index.html
          git diff --cached --quiet || git commit -m "Atualiza checklist"
          git push
